<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentos Feroces — Ya llega...</title>
  <meta name="description" content="Cuentos Feroces — Próximamente">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFD200;
      font-family: 'Inter', sans-serif;
      position: relative;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
    }

    .logo {
      width: clamp(280px, 55vw, 520px);
      margin-bottom: 2.5rem;
      animation: dropIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .phrase {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(-4px, -0.5vw, -1px);
      margin-bottom: 3.5rem;
      animation: fadeIn 1s ease-out 0.4s both;
    }

    .phrase img {
      height: clamp(40px, 7vw, 75px);
      width: auto;
      display: block;
    }

    .phrase .space {
      width: clamp(8px, 2vw, 20px);
    }

    /* Y */
    .phrase img:nth-child(1) {
      transform: rotate(-5deg) translateY(4px);
    }
    /* A (first) */
    .phrase img:nth-child(2) {
      transform: rotate(3deg) translateY(-6px) scale(1.2);
    }
    /* L (first) */
    .phrase img:nth-child(4) {
      transform: rotate(4deg) translateY(3px) translateX(5px);
    }
    /* L (second) */
    .phrase img:nth-child(5) {
      transform: rotate(-3deg) translateY(-5px) scale(0.8);
      margin-left: clamp(-8px, -1.2vw, -4px);
    }
    /* E */
    .phrase img:nth-child(6) {
      transform: rotate(5deg) translateY(6px);
    }
    /* G */
    .phrase img:nth-child(7) {
      transform: rotate(-4deg) translateY(-3px);
    }
    /* A (last) */
    .phrase img:nth-child(8) {
      transform: rotate(3deg) translateY(5px) scale(1.2);
    }

    .divider {
      width: 50px;
      height: 3px;
      background: #1a1a1a;
      margin: 0 auto 2.5rem;
      opacity: 0.3;
      animation: fadeIn 1s ease-out 0.7s both;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease-out 0.9s both;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #1a1a1a;
      color: #1a1a1a;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .socials a:hover {
      background: #1a1a1a;
      color: #FFD200;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .socials a svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .contact {
      animation: fadeIn 1s ease-out 1.1s both;
    }

    .contact a {
      color: #1a1a1a;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .contact a:hover {
      opacity: 1;
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
